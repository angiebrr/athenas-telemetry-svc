###################################################################################################
# This workflow is used to validate the code in the repository, which includes:
# - Running unit and integ tests
# - Running acceptance tests
# - Linting the code
# - Running govulncheck to check for known vulnerabilities in dependencies
#
# Each job sets up its toolchain and go caches through the local setup-go-env composite action.
###################################################################################################

name: "Validation"

permissions:
  contents: read
  # annotate PRs with linting results
  pull-requests: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  MISE_ENV: ci

# /////////////////////////////////////////////////////////////////////////////////////////////////

jobs:
  # =============================================
  # UNIT / INTEG TESTS
  # =============================================
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-env

      - name: Run telemetry service tests
        run: mise run test telemetry-svc

  # =============================================
  # ACCEPTANCE TESTS
  # =============================================
  acceptance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-env

      - name: Run acceptance tests
        run: mise run test acceptance-tests

  # =============================================
  # LINTING
  # =============================================
  #
  # NOTE: 
  #   - This uses golangci-lint-action rather than `mise run lint` so findings show up as inline
  #     annotations on the PR diff. 
  #   - install-mode "none" means it runs the mise-pinned binary rather than installing its own,
  #     so the version stays declared in exactly one place.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-env

      - name: Lint telemetry service
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          working-directory: athenas-telemetry-svc
          args: --config=${{ github.workspace }}/.golangci.yml

      - name: Lint acceptance tests
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          working-directory: athenas-acceptance-tests
          args: --config=${{ github.workspace }}/.golangci.yml

  # =============================================
  # VULNERABILITY SCANNING
  # =============================================
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-env

      - name: Scan every project
        run: mise run vulncheck
